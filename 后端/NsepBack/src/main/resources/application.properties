# 应用名称
spring.application.name=NsepBack

#修改内置tomcat端口号
server.port=8081

##设置项目上下文根
#server.servlet.context-path=/Nsep

spring.datasource.username=${NSEP_DB_USERNAME:nsep_user}
spring.datasource.password=${NSEP_DB_PASSWORD:change_me}
spring.datasource.url=${NSEP_DB_URL:jdbc:mysql://127.0.0.1:3306/nsep?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=GMT%2B8}
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

# CORS allowed origins, comma separated.
# NOTE: Credentials are enabled for CORS, so origins must be explicit values (no "*").
nsep.cors.allowed-origins=${NSEP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# Vulnerable BUGcontroller endpoints are teaching resources and must stay disabled in production.
nsep.bug-controller.enabled=${NSEP_BUG_CONTROLLER_ENABLED:false}
